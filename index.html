<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Unlukt — Exclusive Creator Platform | Subscribe & Support Creators</title>
  <meta name="description" content="Unlukt is the ultimate creator platform. Subscribe to your favorite creators, unlock exclusive content, and support them directly. Join thousands of creators earning on Unlukt." />
  <meta name="keywords" content="unlukt, creator platform, exclusive content, subscribe creators, support creators, content creators, fan subscription, creator economy" />
  <meta name="author" content="Unlukt" />
  <link rel="canonical" href="https://unlukt.com" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://unlukt.com" />
  <meta property="og:title" content="Unlukt — Exclusive Creator Platform" />
  <meta property="og:description" content="Subscribe to your favorite creators, unlock exclusive content, and support them directly. 80% payout to creators." />
  <meta property="og:image" content="https://unlukt.com/og-image.png" />
  <meta property="og:site_name" content="Unlukt" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://unlukt.com" />
  <meta name="twitter:title" content="Unlukt — Exclusive Creator Platform" />
  <meta name="twitter:description" content="Subscribe to your favorite creators, unlock exclusive content, and support them directly." />
  <meta name="twitter:image" content="https://unlukt.com/og-image.png" />

  <!-- Theme & PWA -->
  <meta name="theme-color" content="#ef4444" />
  <meta name="msapplication-TileColor" content="#ef4444" />

  <!-- Search Engine Directives -->
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Unlukt",
    "url": "https://unlukt.com",
    "description": "The ultimate creator platform. Subscribe, unlock exclusive content, and support creators directly.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://unlukt.com/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
