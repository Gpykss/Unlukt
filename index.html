  <!-- Initial Load Skeleton Script -->
  <script type="text/javascript">
    (function() {
      // 1. Get username from query param or pathname
      const params = new URLSearchParams(window.location.search);
      
      // Check if user is authenticated in localStorage
      let hasAuthUser = false;
      try {
        if (localStorage.getItem('unlukt_auth_session') === 'true') {
          hasAuthUser = true;
        } else {
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('firebase:authUser:')) {
              hasAuthUser = true;
              break;
            }
          }
        }
      } catch (e) {}

      if (params.get('entered') === 'true' || hasAuthUser) {
        document.write('<style>.initial-skeleton-container { display: none !important; } .auth-loading-spinner { display: flex !important; }</style>');
      }
      let username = params.get('username') || params.get('ref');
      if (!username) {
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        if (pathParts.length > 0) {
          const first = pathParts[0];
          const second = pathParts[1];
          // Exclude common routes
          const reserved = ['feed', 'login', 'register', 'dashboard', 'settings', 'wallet', 'analytics', 'search', 'discover', 'explore', 'messages', 'notifications', 'complete-profile', 'edit-profile', 'admin', 'legal', 'help', 'about', 'support', 'communities', 'create-community', 'community', 'my-calls', 'become-creator', 'video-call', 'voice-call'];
          if (first === 'creator' && second) {
            username = second;
          } else if (!reserved.includes(first)) {
            username = first;
          }
        }
      }
      
      // 2. Set dynamic image source for skeleton on DOMContentLoaded
      document.addEventListener('DOMContentLoaded', function() {
        const profileView = document.getElementById('skeleton-profile-view');
        const exploreView = document.getElementById('skeleton-explore-view');

        if (username) {
          if (profileView) profileView.style.display = 'block';
          if (exploreView) exploreView.style.display = 'none';

          const fallbackImg = document.getElementById('skeleton-fallback-image');
          if (fallbackImg) {
            const customUrl = '/ads/' + username + '/fallback-1.webp';
            fallbackImg.onerror = function() {
              fallbackImg.src = '/ads/default/fallback-1.webp';
            };
            fallbackImg.src = customUrl;
          } else {
            fallbackImg.src = '/ads/default/fallback-1.webp';
          }

          // Check if creator is live
          const cleanUsername = username.replace('@', '').trim().toLowerCase();
          const firestoreUrl = 'https://firestore.googleapis.com/v1/projects/ogfans-2d4a6/databases/(default)/documents:runQuery';
          const queryPayload = {
            structuredQuery: {
              from: [{ collectionId: 'users' }],
              where: {
                fieldFilter: {
                  field: { fieldPath: 'username' },
                  op: 'EQUAL',
                  value: { stringValue: cleanUsername }
                }
              },
              limit: 1
            }
          };

          fetch(firestoreUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(queryPayload)
          })
          .then(function(response) { return response.json(); })
          .then(function(data) {
            if (Array.isArray(data) && data.length > 0 && data[0].document) {
              const fields = data[0].document.fields;
              const isLive = fields && fields.is_live && fields.is_live.booleanValue === true;
              if (isLive) {
                const buttons = document.querySelectorAll('.skeleton-cta-button');
                buttons.forEach(function(button) {
                  button.textContent = 'Tap to Join Her Live Private Room Now';
                });
              }
            }
          })
          .catch(function(err) { console.error('Error fetching live status:', err); });

        } else {
          if (profileView) profileView.style.display = 'none';
          if (exploreView) exploreView.style.display = 'block';

          // Fetch all live creators and render them in the explore view slider
          const firestoreUrl = 'https://firestore.googleapis.com/v1/projects/ogfans-2d4a6/databases/(default)/documents:runQuery';
          const queryPayload = {
            structuredQuery: {
              from: [{ collectionId: 'users' }],
              where: {
                fieldFilter: {
                  field: { fieldPath: 'is_live' },
                  op: 'EQUAL',
                  value: { booleanValue: true }
                }
              }
            }
          };

          fetch(firestoreUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(queryPayload)
          })
          .then(function(response) { return response.json(); })
          .then(function(data) {
            const container = document.getElementById('skeleton-live-slider');
            if (!container) return;
            container.innerHTML = ''; // clear placeholders

            let liveCount = 0;
            if (Array.isArray(data)) {
              data.forEach(function(item) {
                if (item.document && item.document.fields) {
                  const fields = item.document.fields;
                  const u = fields.username ? fields.username.stringValue : '';
                  const disp = fields.displayName ? fields.displayName.stringValue : u;
                  const b = fields.bio ? fields.bio.stringValue : 'Join my live room now!';
                  const av = fields.profilePicture ? fields.profilePicture.stringValue : (fields.avatar ? fields.avatar.stringValue : '/ads/default/fallback-1.webp');
                  const uid = fields.uid ? fields.uid.stringValue : '';

                  if (u) {
                    liveCount++;
                    const card = document.createElement('div');
                    card.className = 'skeleton-slide-card';
                    card.innerHTML = `
                      <img class="skeleton-slide-bg" src="/ads/${u}/fallback-1.webp" onerror="this.src='/ads/default/fallback-1.webp'" />
                      <div class="skeleton-slide-overlay"></div>
                      <div class="skeleton-live-badge-static">
                        <span style="display:inline-block;width:6px;height:6px;background-color:white;border-radius:50%;animation:blinkingRed 1.5s infinite;"></span>
                        <span>LIVE NOW</span>
                      </div>
                      <div class="skeleton-slide-content">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                          <img src="${av}" onerror="this.src='/ads/default/fallback-1.webp'" style="width:32px;height:32px;border-radius:50%;border:1.5px solid #f43f5e;object-fit:cover;" />
                          <div style="min-width:0;flex:1;">
                            <p class="skeleton-slide-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;font-size:14px;font-weight:800;">${disp}</p>
                            <p style="font-size:10px;color:#f43f5e;margin:0;font-weight:700;">@${u}</p>
                          </div>
                        </div>
                        <p class="skeleton-slide-text" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${b}</p>
                        <button class="skeleton-slide-btn" onclick="window.location.href='/livestream/${uid}'">Tap to Join Live Room</button>
                      </div>
                    `;
                    container.appendChild(card);
                  }
                }
              });
            }

            if (liveCount === 0) {
              // Drisana fallback
              container.innerHTML = `
                <!-- Drisana Dummy Slide -->
                <div class="skeleton-slide-card" onclick="window.location.href='/creator/drisana'">
                  <img class="skeleton-slide-bg" src="/ads/drisana/fallback-1.webp" />
                  <div class="skeleton-slide-overlay"></div>
                  <div class="skeleton-live-badge-static" style="background-color:rgba(219,39,119,0.9);">
                    <span style="display:inline-block;width:6px;height:6px;background-color:#fbcfe8;border-radius:50%;animation:blinkingRed 1.5s infinite;"></span>
                    <span>DAILY SHOWS</span>
                  </div>
                  <div class="skeleton-slide-content">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                      <img src="/ads/drisana/image-1.webp" onerror="this.src='/ads/drisana/fallback-1.webp'" style="width:32px;height:32px;border-radius:50%;border:1.5px solid #db2777;object-fit:cover;" />
                      <div style="min-width:0;flex:1;">
                        <p class="skeleton-slide-title" style="margin:0;font-size:14px;font-weight:800;">Drisana</p>
                        <p style="font-size:10px;color:#db2777;margin:0;font-weight:700;">@drisana</p>
                      </div>
                    </div>
                    <p class="skeleton-slide-text">Drisana's Private Lounge Active Daily — Scheduled Shows Streaming Tonight! 🤫</p>
                    <button class="skeleton-slide-btn" style="background:linear-gradient(to right, #db2777, #ec4899);" onclick="event.stopPropagation(); window.location.href='/creator/drisana'">View Scheduled Showtimes</button>
                  </div>
                </div>

                <!-- Scheduled Showtimes Slide Card -->
                <div class="skeleton-slide-card" style="background-color:#ffffff;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;border:1px solid rgba(0,0,0,0.05);">
                  <div style="flex:1;">
                    <div style="display:flex;align-items:center;gap:6px;color:#f43f5e;margin-bottom:12px;">
                      <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"></path></svg>
                      <span style="font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:#1e293b;margin:0 0 0 4px;">Scheduled Showtimes</span>
                    </div>
                    <p style="font-size:10px;color:#64748b;margin:0 0 12px 0;line-height:1.4;">Don't miss the next interactive live streaming event! Set reminders for these showtimes:</p>
                    
                    <div style="display:flex;flex-direction:column;gap:8px;">
                      <div style="display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:6px 10px;border-radius:8px;border:1px solid #f1f5f9;">
                        <span style="font-size:10px;font-weight:800;color:#1e293b;">Mon, Wed, Fri</span>
                        <span style="font-size:9px;font-weight:700;color:#f43f5e;background:#fff5f5;padding:2px 6px;border-radius:6px;">9:00 PM EST</span>
                      </div>
                      <div style="display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:6px 10px;border-radius:8px;border:1px solid #f1f5f9;">
                        <span style="font-size:10px;font-weight:800;color:#1e293b;">Thursday</span>
                        <span style="font-size:9px;font-weight:700;color:#f43f5e;background:#fff5f5;padding:2px 6px;border-radius:6px;">10:00 PM EST</span>
                      </div>
                      <div style="display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:6px 10px;border-radius:8px;border:1px solid #f1f5f9;">
                        <span style="font-size:10px;font-weight:800;color:#1e293b;">Saturday</span>
                        <span style="font-size:9px;font-weight:700;color:#f43f5e;background:#fff5f5;padding:2px 6px;border-radius:6px;">11:00 PM EST</span>
                      </div>
                    </div>
                  </div>
                  <button class="skeleton-slide-btn" style="background:#0f172a;margin-top:10px;" onclick="window.location.href='/creator/drisana'">Explore Profile</button>
                </div>
              `;
            }
          })
          .catch(function(err) { console.error('Error fetching live creators:', err); });
        }
      });
    })();
  </script>

  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      background-color: #020617; /* bg-slate-950 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .initial-skeleton-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #020617;
      color: #ffffff;
      box-sizing: border-box;
    }

    .initial-skeleton-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #111827; /* border-gray-900 */
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      box-sizing: border-box;
    }

    .skeleton-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .skeleton-avatar-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #1e293b;
    }

    .skeleton-header-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .skeleton-line-title {
      width: 100px;
      height: 12px;
      background-color: #1e293b;
      border-radius: 4px;
    }

    .skeleton-line-subtitle {
      width: 70px;
      height: 10px;
      background-color: #f43f5e;
      border-radius: 4px;
      opacity: 0.8;
    }

    .skeleton-header-badge {
      padding: 4px 12px;
      background-color: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.2);
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      color: #fb7185;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .initial-skeleton-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1152px; /* max-w-6xl */
      margin: 0 auto;
      padding: 16px;
      gap: 24px;
      box-sizing: border-box;
    }

    .initial-skeleton-left {
      width: 100%;
      max-width: 448px; /* max-w-md */
      margin: 0 auto;
    }

    .initial-skeleton-hero {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 24px;
      overflow: hidden;
    }

    .initial-skeleton-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .initial-skeleton-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #020617 0%, transparent 100%);
      pointer-events: none;
    }

    .initial-skeleton-live-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background-color: #e11d48;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-badge-dot {
      width: 6px;
      height: 6px;
      background-color: #ffffff;
      border-radius: 50%;
      animation: skeleton-ping 1.5s infinite alternate;
    }

    .initial-skeleton-right {
      width: 100%;
      max-width: 448px;
      margin: 0 auto;
      background-color: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(30, 41, 59, 0.8);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }

    .skeleton-desktop-info {
      display: none;
    }

    .skeleton-line-text {
      background-color: #1e293b;
      border-radius: 6px;
    }

    .skeleton-grid-section {
      margin-top: 16px;
    }

    .skeleton-grid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .skeleton-grid-wrapper {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .skeleton-grid-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background-color: #020617;
      border: 1px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .skeleton-lock-icon {
      width: 20px;
      height: 16px;
      background-color: rgba(244, 63, 94, 0.2);
      border-radius: 4px;
      border: 2px solid #f43f5e;
      position: relative;
      margin-top: 8px;
    }

    .skeleton-lock-icon::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 3px;
      width: 10px;
      height: 8px;
      border: 2px solid #f43f5e;
      border-bottom: none;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }

    .skeleton-desktop-cta {
      display: none;
    }

    .skeleton-mobile-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, #020617 80%, transparent);
      padding: 16px;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }

    .skeleton-cta-button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(to right, #f43f5e, #db2777);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
      outline: none;
      border: none;
    }

    .skeleton-cta-subtext {
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }

    .pulsing {
      animation: skeleton-pulse 2s infinite ease-in-out;
    }

    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @keyframes skeleton-ping {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    /* Desktop overrides */
    @media (min-width: 768px) {
      .initial-skeleton-container {
        padding-bottom: 24px;
      }

      .initial-skeleton-main {
        flex-direction: row;
        padding: 24px;
        gap: 32px;
        align-items: stretch;
      }

      .initial-skeleton-left {
        max-width: none;
        margin: 0;
      }

      .initial-skeleton-right {
        max-width: none;
        width: 380px;
        margin: 0;
        background-color: rgba(15, 23, 42, 0.4);
        padding: 32px;
        justify-content: space-between;
      }

      @media (min-width: 1024px) {
        .initial-skeleton-right {
          width: 420px;
        }
      }

      .skeleton-desktop-info {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      .skeleton-avatar-circle-large {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background-color: #1e293b;
      }

      .skeleton-desktop-meta {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .skeleton-desktop-cta {
        display: block;
        margin-top: 32px;
      }

      .skeleton-mobile-cta {
        display: none;
      }
    }

    /* Auth loading spinner styles */
    .auth-loading-spinner {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #020617; /* bg-slate-950 */
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner-ring {
      width: 40px;
      height: 40px;
